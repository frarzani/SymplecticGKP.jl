[sources]
# LatticeDecoder is used only for classical-LDLC generation; depending on it pulls
# Oscar/Nemo, so the first precompile is heavy — instantiate once up front (on a
# login node before cluster runs). Pinned to the squashed v0.1.0 public release
# (single commit "Prepare v0.1.0 public paper release"); the classical_ldlc source
# we use is byte-identical to the earlier submission commit.
LatticeDecoder    = {rev = "a10a798e47a920290428225da94a90edf841a7c0", url = "https://github.com/timohillmann/LatticeDecoder.jl.git"}
# Julia does NOT transitively resolve a git dependency's own [sources], so we must
# re-declare the LatticeAlgorithms git source here as well. This matches the exact
# commit LatticeDecoder's v0.1.0 release itself pins.
LatticeAlgorithms = {rev = "152d72e1e0195ab14dde0679abf2a5b6b8288a1d", url = "https://github.com/amazon-science/LatticeAlgorithms.jl.git"}

[compat]
Combinatorics = "1"
JLD2 = "0.4"
LatticeAlgorithms = "0.1"
LatticeDecoder = "0.1"
Nemo = "0.56"
Primes = "0.5"
julia = "1.11"   # [sources] requires ≥ 1.11 (dev machine runs 1.12)

[extras]
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"

[targets]
test = ["Test"]
