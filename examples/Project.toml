# Lightweight environment for the example notebooks that only *read* saved data
# and plot it (the distance/Voronoi walkthroughs and the paper-figure notebook).
#
# It deliberately does NOT depend on SymplecticGKP — that keeps these notebooks
# fast (no Oscar/Nemo load). Data *generation* is done in the package env (see the
# scripts/), which has the full pipeline. ZipFile unpacks data/paper/instances.zip.
#
# Instantiate once:  julia --project=examples -e 'using Pkg; Pkg.instantiate()'
#
# (The canonical_forms_and_balancing.ipynb tutorial is the exception: it demonstrates
#  the package API and activates the package env at the repo root instead.)
[deps]
JLD2 = "033835bb-8acc-5ee8-8aae-3f567f8a3819"
LaTeXStrings = "b964fa9f-0449-5b57-a5c2-d3ea65f4040f"
Measures = "442fdcdd-2543-5da2-b0f3-8c86c306513e"
Plots = "91a5bcdd-55d7-5caf-9e0b-520d859cae80"
ZipFile = "a5390f91-8eb1-5f08-bee0-b1d1ffed6cea"

[compat]
JLD2 = "0.4"   # match the writer (SymplecticGKP) so v2 files read cleanly
